name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. cli-v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#cli-v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p aster-cli --bin aster --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        id: pkg
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TARGET="${{ matrix.target }}"
          DIR="aster-${VERSION}-${TARGET}"
          ASSET="${DIR}.tar.gz"
          mkdir "$DIR"
          cp "target/${TARGET}/release/aster" "$DIR/"
          tar -czf "$ASSET" "$DIR"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          else
            sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Package (windows)
        if: runner.os == 'Windows'
        id: pkg_win
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $target = "${{ matrix.target }}"
          $dir = "aster-$version-$target"
          $asset = "$dir.zip"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/$target/release/aster.exe" "$dir/"
          Compress-Archive -Path $dir -DestinationPath $asset -Force
          (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower() | Out-File -NoNewline -Encoding ascii "$asset.sha256"
          "asset=$asset" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            ${{ steps.pkg.outputs.asset }}${{ steps.pkg_win.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}${{ steps.pkg_win.outputs.asset }}.sha256

      - name: Upload CLI binary for the desktop sidecar
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/aster${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: desktop ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            args: --target aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-13
            args: --target x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            args: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-${{ matrix.target }}

      - name: Download prebuilt CLI
        uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: desktop/.sidecar

      - name: Point sidecar at the prebuilt CLI
        id: sidecar
        shell: bash
        run: |
          BIN="$GITHUB_WORKSPACE/desktop/.sidecar/aster"
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"
          echo "ASTER_CLI_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build and upload desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
