<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aster</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0a0a0a;
        --fg: #ededed;
        --dim: #8f8f8f;
        --line: #232323;
        --surface: #111111;
        --accent: #f79b4d;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fbfbfa;
          --fg: #1b1b1b;
          --dim: #6b6b6b;
          --line: #e4e4e1;
          --surface: #ffffff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 30rem; }
      .mark { width: 26px; height: 26px; display: block; margin-bottom: 20px; }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p { margin: 0; color: var(--dim); }
      ol {
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
        counter-reset: step;
      }
      li {
        counter-increment: step;
        padding: 10px 0;
      }
      li::before {
        content: counter(step);
        display: inline-block;
        width: 18px;
        color: var(--dim);
        font-family: var(--mono);
        font-size: 12px;
      }
      .what { font-size: 14px; }
      code {
        display: block;
        margin: 8px 0 0 18px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--fg);
        font-family: var(--mono);
        font-size: 12.5px;
        overflow-x: auto;
        white-space: pre;
      }
      .note {
        margin-top: 22px;
        font-size: 13px;
      }
      .note code { display: inline; margin: 0; padding: 1px 5px; font-size: 12px; }
      b { color: var(--accent); font-weight: 600; }
    </style>
  </head>

</html>
