[package]
edition.workspace = true
license.workspace = true
name = "aster-cli"
version.workspace = true

[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "2.1"
anydoc = { workspace = true }
anyhow = { workspace = true }
aster-agents = { path = "../aster-agents" }
aster-acp = { path = "../aster-acp" }
aster-analyzers = { path = "../aster-analyzers" }
aster-cron = { path = "../aster-cron" }
aster-lsp = { path = "../aster-lsp" }
aster-ai = { path = "../aster-ai" }
aster-mom = { path = "../aster-mom" }
aster-eval = { path = "../aster-eval" }
aster-harness = { path = "../aster-harness" }
aster-mcp = { path = "../aster-mcp" }
aster-memory = { path = "../aster-memory" }
aster-models = { path = "../aster-models" }
aster-plugins = { path = "../aster-plugins" }
aster-policy = { path = "../aster-policy" }
aster-persist = { path = "../aster-persist" }
aster-remote = { path = "../aster-remote" }
aster-sandbox = { path = "../aster-sandbox" }
aster-serve = { path = "../aster-serve" }
aster-shortcuts = { path = "../aster-shortcuts" }
aster-skills = { path = "../aster-skills" }
aster-telemetry = { path = "../aster-telemetry" }
aster-tools = { path = "../aster-tools" }
aster-web = { path = "../aster-web" }
aster-webmcp = { path = "../aster-webmcp" }
base64 = "0.23.1"
clap = { features = ["derive", "env"], version = "4.5" }
cliclack = "0.5.5"
chrono = { workspace = true }
console = "0.16"
crossterm = { features = ["event-stream"], version = "0.28.1" }
dirs = "6.0"
dotenvy = "0.15"
flate2 = "1"
futures-util = { default-features = false, version = "0.3" }
globset = { workspace = true }
ignore = "0.4"
image = { default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
], version = "0.25.10" }
libc = "0.2"
open = "5"
pulldown-cmark = { default-features = false, version = "0.12" }
rand = "0.8"
ratatui = { features = [
    "scrolling-regions",
    "unstable-widget-ref",
    "unstable-rendered-line-info",
], version = "0.29" }
reqwest = { features = ["stream", "blocking"], workspace = true }
reqwest-middleware = { features = ["json"], version = "0.4" }
self-replace = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
tar = { default-features = false, version = "0.4" }
tempfile = "3"
tokio = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { features = ["env-filter"], version = "0.3" }
unicode-width = "0.2"
ulid = "1"

[dev-dependencies]
wiremock = "0.6"
