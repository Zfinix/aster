[package]
name = "aster-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { workspace = true }
reqwest-middleware = { version = "0.4", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
dirs = "6.0"
ratatui = { version = "0.29", features = [
    "scrolling-regions",
    "unstable-widget-ref",
    "unstable-rendered-line-info",
] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
serde_yaml = "0.9"
globset = { workspace = true }
tempfile = "3"
ignore = "0.4"
open = "5"

aster-ai = { path = "../aster-ai" }
aster-harness = { path = "../aster-harness" }
aster-models = { path = "../aster-models" }
aster-policy = { path = "../aster-policy" }
aster-persist = { path = "../aster-persist" }
aster-skills = { path = "../aster-skills" }
aster-tools = { path = "../aster-tools" }
aster-sandbox = { path = "../aster-sandbox" }
cliclack = "0.5.5"
console = "0.16"
