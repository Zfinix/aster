[workspace]
resolver = "3"
members = [
    "crates/aster-models",
    "crates/aster-ai",
    "crates/aster-index",
    "crates/aster-analyzers",
    "crates/symbol-extractor",
    "crates/aster-harness",
    "crates/aster-policy",
    "crates/aster-persist",
    "crates/aster-eval",
    "crates/aster-telemetry",
    "crates/aster-skills",
    "crates/aster-agents",
    "crates/aster-mcp",
    "crates/aster-plugins",
    "crates/aster-tools",
    "crates/aster-sandbox",
    "crates/aster-web",
    "crates/aster-remote",
    "crates/aster-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zfinix/aster"

[workspace.dependencies]
anydoc = "0.1"
anyhow = "1.0.99"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process", "sync"] }
tracing = "0.1.41"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1.0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
globset = "0.4"
ulid = "1"
