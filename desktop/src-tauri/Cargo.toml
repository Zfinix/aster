[package]
name = "aster-desktop"
version = "0.1.0"
description = "Desktop app for the aster AI code reviewer"
edition = "2021"
license = "Apache-2.0"

# Standalone from the crates/* OSS workspace so the desktop shell never
# perturbs the library crates or their lockfile.
[workspace]

[lib]
name = "aster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }
dirs = "5"
